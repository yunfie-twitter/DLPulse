name: Build and Push to GHCR and Docker Hub

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write  # GHCR用

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------
      # ① GHCR にログイン
      # ------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------
      # ② Docker Hub にログイン
      # ------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ------------------------------------------------
      # yt-dlp-api イメージのビルド＆Push
      # ------------------------------------------------
      - name: Build and push yt-dlp-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/yt-dlp-api:latest
            ghcr.io/${{ github.repository_owner }}/yt-dlp-api:${{ github.run_number }}
            ${{ secrets.DOCKER_USERNAME }}/yt-dlp-api:latest
            ${{ secrets.DOCKER_USERNAME }}/yt-dlp-api:${{ github.run_number }}

      # ------------------------------------------------
      # celery_worker イメージのビルド＆Push
      # ------------------------------------------------
      - name: Build and push celery_worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/yt-dlp-celery:latest
            ghcr.io/${{ github.repository_owner }}/yt-dlp-celery:${{ github.run_number }}
            ${{ secrets.DOCKER_USERNAME }}/yt-dlp-celery:latest
            ${{ secrets.DOCKER_USERNAME }}/yt-dlp-celery:${{ github.run_number }}
